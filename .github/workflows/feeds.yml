name: Build feeds

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      # Each scraper writes to a temp file first, so a site whose markup changed
      # leaves its own feed untouched instead of blocking every other feed.
      - name: Build feeds
        run: |
          failed=0
          for scraper in scrapers/*.py; do
            feed="$(basename "$scraper" .py).xml"
            if uv run --locked python "$scraper" > "$feed.tmp"; then
              mv "$feed.tmp" "$feed"
            else
              echo "::error file=$scraper::$scraper failed; leaving $feed unchanged"
              rm -f "$feed.tmp"
              failed=1
            fi
          done
          exit $failed

      - name: Commit feed updates
        if: ${{ !cancelled() }}
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add ./*.xml
          if ! git diff --staged --quiet; then
            git commit -m "update feeds"
            git push
          fi
